[project]
name = "gideon"
version = "0.4.6"
description = "Gideon - assistente pessoal local com texto, voz, memoria e ferramentas"
readme = "README.md"
authors = [
    { name = "tteuwxsw", email = "matheushenriqueal5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "google-genai>=2.33.0",
    "keyring>=25.7.0",
    "numpy>=2.0.0",
    "av>=14.0.0",
    "psutil>=7.2.2",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
    "vosk>=0.3.45",
    "pystray>=0.19.5",
    "pillow>=13.0.0",
]

[project.scripts]
gideon = "gideon.cli:main"
gideonctl = "gideon.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pyinstaller-hooks-contrib>=2026.9",
]
