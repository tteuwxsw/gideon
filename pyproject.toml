[project]
name = "gideon"
version = "0.2.0"
description = "Gideon — Assistente Pessoal com Interface Holográfica"
readme = "README.md"
authors = [
    { name = "tteuwxsw", email = "matheushenriqueal5@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "fastapi>=0.162.0",
    "faster-whisper>=1.2.1",
    "google-genai>=2.33.0",
    "keyring>=25.7.0",
    "kokoro-onnx>=0.6.1",
    "psutil>=7.2.2",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
    "websockets>=15.0",
]

[project.scripts]
gideon = "gideon:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
