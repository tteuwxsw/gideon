[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Usa DirectX 11 (SM5) por padrao na AMD Radeon RX 580 8GB:
; 1) Garante suporte nativo ao canal Alpha na SwapChain DWM (transparencia real na area de trabalho)
; 2) Economiza ~1.4 GB de VRAM em comparacao ao DX12 + VSM + Lumen
DefaultGraphicsRHI=DefaultGraphicsRHI_DX11

[SystemSettings]
; --- Otimizacao estrita para AMD Radeon RX 580 (8 GB VRAM, Polaris) ---
; Desativa Lumen, Nanite, RayTracing e Virtual Shadow Maps (desnecessarios para busto holografico)
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=1
r.Nanite=0
r.RayTracing=0
r.Shadow.Virtual.Enable=0

; Preserva o canal Alpha no Post-Processing para janela transparente sobre o Windows 10
r.PostProcessing.PropagateAlpha=1
r.DefaultFeature.AntiAliasing=2
r.TemporalAA.Upsampling=0
r.DefaultFeature.MotionBlur=0
r.DefaultFeature.Bloom=1
r.BloomQuality=3
r.DefaultFeature.AutoExposure=0
r.EyeAdaptationQuality=0
r.SSS.Scale=1.0
r.SSS.SampleSet=1

; --- Otimizacao de MetaHuman na RX 580 ---
; Desativa fios individuais de cabelo (Groom Strands) e forca Hair Cards (LOD >= 2)
r.HairStrands.Enable=0
r.HairStrands.Cards=1
r.SkeletalMeshLODBias=1
r.Streaming.PoolSize=1024
r.Streaming.MaxEffectiveScreenSize=0

