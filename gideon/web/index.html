<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Gideon</title>
  <style>
    :root {
      --bg: #07090d;
      --panel: rgba(15, 19, 27, .72);
      --panel-solid: #10141d;
      --line: rgba(255, 255, 255, .075);
      --line-bright: rgba(131, 222, 255, .19);
      --text: #f3f6fa;
      --muted: #858e9d;
      --cyan: #77dcff;
      --blue: #4e8cff;
      --violet: #8b6cff;
      --green: #65e3b4;
      --danger: #ff7888;
      --shadow: 0 28px 80px rgba(0, 0, 0, .38);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 48% 31%, rgba(68, 109, 177, .11), transparent 31%),
        radial-gradient(circle at 92% 2%, rgba(100, 75, 178, .08), transparent 28%),
        var(--bg);
      font: 14px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-columns: 76px minmax(520px, 1fr) 310px;
      width: 100vw;
      height: 100vh;
      min-height: 560px;
    }

    .rail {
      position: relative;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 22px 12px 18px;
      border-right: 1px solid var(--line);
      background: rgba(6, 8, 12, .72);
      backdrop-filter: blur(20px);
    }

    .brand {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      margin-bottom: 40px;
      border: 1px solid rgba(125, 222, 255, .26);
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(101, 197, 255, .16), rgba(112, 74, 216, .08));
      box-shadow: inset 0 0 18px rgba(108, 216, 255, .06), 0 8px 24px rgba(0, 0, 0, .28);
    }

    .brand-mark {
      position: relative;
      width: 18px;
      height: 22px;
      border: 2px solid var(--cyan);
      border-right-color: transparent;
      border-radius: 50%;
      transform: rotate(15deg);
      filter: drop-shadow(0 0 7px rgba(119, 220, 255, .5));
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      right: -2px;
      bottom: 2px;
      width: 8px;
      height: 2px;
      border-radius: 2px;
      background: var(--cyan);
      transform: rotate(-15deg);
    }

    .rail-nav { display: flex; flex: 1; flex-direction: column; gap: 10px; }
    .rail-bottom { display: flex; flex-direction: column; gap: 10px; }
    .icon-btn {
      position: relative;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: #7e8795;
      cursor: pointer;
      transition: .2s ease;
    }
    .icon-btn:hover { color: #dbe8f1; background: rgba(255,255,255,.045); }
    .icon-btn.active {
      color: var(--cyan);
      border-color: rgba(119, 220, 255, .15);
      background: rgba(119, 220, 255, .075);
      box-shadow: inset 0 0 15px rgba(119, 220, 255, .03);
    }
    .icon-btn.active::before {
      content: "";
      position: absolute;
      left: -13px;
      width: 2px;
      height: 18px;
      border-radius: 2px;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }
    .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; }

    .workspace {
      position: relative;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      padding: 0 34px 24px;
      overflow: hidden;
    }
    .workspace::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .17;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, black, transparent 72%);
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 78px;
      border-bottom: 1px solid var(--line);
    }
    .title-block h1 { margin: 0; font-size: 15px; font-weight: 590; letter-spacing: .02em; }
    .title-block p { margin: 2px 0 0; color: var(--muted); font-size: 11px; letter-spacing: .11em; text-transform: uppercase; }
    .connection {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #9aa3b0;
      font-size: 12px;
    }
    .connection-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 11px rgba(101, 227, 180, .7);
    }
    .connection.offline .connection-dot { background: var(--danger); box-shadow: none; }

    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      width: 100%;
      min-height: 0;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 0 8px;
    }

    .orb-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(270px, 38vh, 390px);
      aspect-ratio: 1;
      flex: 0 0 auto;
      margin-bottom: 8px;
      transition: width .45s ease, margin .45s ease;
    }
    .app.has-chat .orb-wrap { width: clamp(180px, 25vh, 255px); margin-bottom: 4px; }
    .orbit, .orbit::before, .orbit::after {
      position: absolute;
      inset: 4%;
      border: 1px solid rgba(128, 220, 255, .11);
      border-radius: 50%;
    }
    .orbit { animation: rotate 22s linear infinite; }
    .orbit::before, .orbit::after { content: ""; inset: 7%; border-style: dashed; }
    .orbit::before { transform: rotate(63deg) scaleY(.72); }
    .orbit::after { transform: rotate(-34deg) scaleX(.77); border-color: rgba(146, 111, 255, .12); }
    .orb-halo {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(76, 164, 255, .18), rgba(77, 125, 255, .03) 55%, transparent 70%);
      filter: blur(15px);
      animation: breathe 4.8s ease-in-out infinite;
    }
    .avatar-shell {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      inset: 0;
      border-radius: 50%;
      isolation: isolate;
    }
    .avatar-image {
      position: relative;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: saturate(.92) contrast(1.06) drop-shadow(0 0 9px rgba(103, 215, 255, .45)) drop-shadow(0 18px 30px rgba(0, 0, 0, .48));
      transform-origin: 50% 56%;
      animation: avatarIdle 6s ease-in-out infinite;
      transition: filter .35s ease;
    }
    .avatar-scan {
      position: absolute;
      z-index: 3;
      inset: 8%;
      border-radius: 50%;
      opacity: .22;
      background: repeating-linear-gradient(0deg, transparent 0 5px, rgba(187, 239, 255, .2) 6px, transparent 7px);
      mask-image: radial-gradient(circle, black 28%, rgba(0,0,0,.7) 58%, transparent 73%);
      mix-blend-mode: screen;
      animation: scanDrift 4s linear infinite;
      pointer-events: none;
    }
    .avatar-fallback { display: none; }
    .avatar-shell.load-error .avatar-image, .avatar-shell.load-error .avatar-scan { display: none; }
    .avatar-shell.load-error .avatar-fallback { display: block; }
    .orb {
      position: relative;
      width: 68%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid rgba(174, 230, 255, .36);
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 24%, rgba(255,255,255,.82) 0, rgba(177,225,255,.28) 4%, transparent 19%),
        radial-gradient(circle at 67% 74%, rgba(129,81,255,.4), transparent 37%),
        radial-gradient(circle at 36% 58%, rgba(76,203,255,.48), transparent 44%),
        linear-gradient(145deg, #17253e 8%, #234c74 41%, #342b71 71%, #14172e 100%);
      box-shadow:
        inset -18px -22px 50px rgba(13, 9, 51, .58),
        inset 16px 18px 40px rgba(167, 232, 255, .12),
        0 0 36px rgba(84, 177, 255, .18),
        0 24px 60px rgba(0, 0, 0, .45);
      transition: filter .35s ease, transform .35s ease;
    }
    .orb::before {
      content: "";
      position: absolute;
      inset: -35%;
      border-radius: 44%;
      background:
        repeating-radial-gradient(ellipse at 30% 70%, transparent 0 8px, rgba(178,231,255,.13) 9px, transparent 11px),
        conic-gradient(from 90deg, transparent, rgba(166, 229, 255, .24), transparent 23%, rgba(126, 90, 255, .19), transparent 52%);
      animation: rotate 15s linear infinite reverse;
      mix-blend-mode: screen;
    }
    .orb::after {
      content: "";
      position: absolute;
      inset: 6%;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,255,255,.13), transparent 36%);
      filter: blur(.2px);
    }
    .orb-grid {
      position: absolute;
      inset: 18%;
      z-index: 2;
      border-radius: 50%;
      opacity: .4;
      background: repeating-linear-gradient(0deg, transparent 0 7px, rgba(180,235,255,.09) 8px 9px);
      mask-image: radial-gradient(circle, black, transparent 74%);
      animation: drift 8s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .orb-wrap.listening .orb { filter: saturate(1.35) brightness(1.14); animation: listenPulse 1.25s ease-in-out infinite; }
    .orb-wrap.listening .orbit { border-color: rgba(100, 231, 255, .42); animation-duration: 6s; }
    .orb-wrap.thinking .orb::before { animation-duration: 2.7s; }
    .orb-wrap.thinking .orb { filter: hue-rotate(13deg) saturate(1.35); }
    .orb-wrap.speaking .orb { animation: speakPulse .72s ease-in-out infinite alternate; }
    .orb-wrap.executing .orbit { border-color: rgba(139, 116, 255, .34); animation-duration: 3.5s; }
    .orb-wrap.observing .orb { filter: saturate(1.15) brightness(1.08); }
    .orb-wrap.error .orb { filter: hue-rotate(125deg) saturate(1.5); }
    .orb-wrap.error .orbit { border-color: rgba(255, 120, 136, .34); }
    .orb-wrap.listening .avatar-image { filter: saturate(1.15) brightness(1.1) drop-shadow(0 0 15px rgba(92, 226, 255, .72)) drop-shadow(0 18px 30px rgba(0,0,0,.46)); }
    .orb-wrap.thinking .avatar-image, .orb-wrap.executing .avatar-image { filter: hue-rotate(15deg) saturate(1.12) drop-shadow(0 0 14px rgba(134, 113, 255, .58)) drop-shadow(0 18px 30px rgba(0,0,0,.46)); }
    .orb-wrap.speaking .avatar-image { animation: avatarSpeak .7s ease-in-out infinite alternate; }
    .orb-wrap.error .avatar-image { filter: hue-rotate(128deg) saturate(1.35) drop-shadow(0 0 13px rgba(255, 102, 125, .55)); }

    .state-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--cyan);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .state-label::before, .state-label::after { content: ""; width: 22px; height: 1px; background: linear-gradient(90deg, transparent, var(--cyan)); opacity: .42; }
    .state-label::after { transform: rotate(180deg); }
    .greeting { margin: 0; font-size: clamp(23px, 3vw, 34px); font-weight: 350; letter-spacing: -.035em; text-align: center; }
    .greeting strong { color: #fff; font-weight: 590; }
    .subline { max-width: 100%; margin: 7px 0 15px; color: var(--muted); font-size: 13px; text-align: center; }
    .app.has-chat .greeting, .app.has-chat .subline, .app.has-chat .suggestions { display: none; }

    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: min(680px, 100%); }
    .suggestion {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #aab2bd;
      background: rgba(255,255,255,.025);
      font-size: 11px;
      cursor: pointer;
      transition: .2s ease;
    }
    .suggestion:hover { border-color: var(--line-bright); color: #e6f7ff; background: rgba(107,203,255,.06); }

    .messages {
      display: none;
      width: min(760px, 100%);
      max-height: min(34vh, 310px);
      padding: 4px 7px 4px 0;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: #27303d transparent;
    }
    .app.has-chat .messages { display: flex; flex-direction: column; gap: 13px; }
    .message { display: flex; gap: 10px; align-items: flex-start; animation: enter .25s ease both; }
    .message.user { justify-content: flex-end; }
    .assistant-mark {
      display: grid;
      place-items: center;
      flex: 0 0 27px;
      width: 27px;
      height: 27px;
      margin-top: 2px;
      border: 1px solid rgba(119,220,255,.24);
      border-radius: 9px;
      color: var(--cyan);
      background: rgba(119,220,255,.07);
      font-size: 10px;
      font-weight: 700;
    }
    .bubble {
      max-width: 78%;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 4px 14px 14px 14px;
      color: #d8dde5;
      background: rgba(16, 21, 30, .82);
      box-shadow: 0 8px 26px rgba(0,0,0,.13);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user .bubble { border-radius: 14px 4px 14px 14px; color: #effaff; border-color: rgba(104,189,255,.14); background: linear-gradient(135deg, rgba(48,92,133,.55), rgba(53,53,104,.48)); }
    .bubble.thinking::after { content: ""; display: inline-block; width: 4px; height: 4px; margin-left: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 8px 0 rgba(119,220,255,.55), 16px 0 rgba(119,220,255,.25); animation: dots 1s infinite; }
    .message-meta { margin-top: 5px; color: #667080; font-size: 10px; }

    .composer-wrap { position: relative; z-index: 3; width: min(780px, 100%); margin: 0 auto; }
    .composer {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: end;
      gap: 9px;
      padding: 9px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 18px;
      background: rgba(15, 19, 27, .86);
      box-shadow: var(--shadow), inset 0 1px rgba(255,255,255,.025);
      backdrop-filter: blur(20px);
    }
    .composer:focus-within { border-color: rgba(119,220,255,.3); box-shadow: 0 20px 65px rgba(0,0,0,.42), 0 0 0 3px rgba(119,220,255,.035); }
    textarea {
      width: 100%;
      min-height: 40px;
      max-height: 112px;
      resize: none;
      padding: 10px 4px 7px;
      border: 0;
      outline: 0 !important;
      color: var(--text);
      background: transparent;
      line-height: 1.45;
    }
    textarea::placeholder { color: #636c79; }
    .compose-btn {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 12px;
      color: #929ba7;
      background: rgba(255,255,255,.045);
      cursor: pointer;
      transition: .2s ease;
    }
    .compose-btn:hover { color: #fff; background: rgba(255,255,255,.08); }
    .compose-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .mic.active { color: #081017; background: var(--cyan); box-shadow: 0 0 22px rgba(119,220,255,.27); }
    .send { color: #091018; background: linear-gradient(135deg, #9ae7ff, #6ca9ff); }
    .send:hover { color: #091018; background: linear-gradient(135deg, #bbf0ff, #83b8ff); transform: translateY(-1px); }
    .send:disabled { opacity: .35; cursor: default; transform: none; }
    .composer-foot { display: flex; justify-content: space-between; padding: 7px 5px 0; color: #596271; font-size: 10px; }

    .activity {
      position: relative;
      z-index: 3;
      display: flex;
      min-width: 0;
      flex-direction: column;
      border-left: 1px solid var(--line);
      background: rgba(9, 12, 17, .64);
      backdrop-filter: blur(18px);
    }
    .activity-head { display: flex; align-items: center; justify-content: space-between; height: 78px; padding: 0 23px; border-bottom: 1px solid var(--line); }
    .activity-head h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .live-tag { display: flex; align-items: center; gap: 6px; color: var(--green); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .live-tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
    .activity-list { flex: 1; min-height: 0; padding: 22px 21px; overflow-y: auto; }
    .activity-date { margin-bottom: 18px; color: #596271; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; }
    .event { position: relative; display: grid; grid-template-columns: 25px 1fr; gap: 10px; padding-bottom: 19px; }
    .event:not(:last-child)::before { content: ""; position: absolute; left: 12px; top: 27px; bottom: 2px; width: 1px; background: var(--line); }
    .event-icon { display: grid; place-items: center; width: 25px; height: 25px; border: 1px solid rgba(119,220,255,.16); border-radius: 8px; color: var(--cyan); background: #101721; font-size: 9px; }
    .event-main { min-width: 0; padding-top: 2px; }
    .event-title { overflow: hidden; color: #cbd1d9; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .event-detail { margin-top: 2px; overflow: hidden; color: #667080; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .event-time { margin-top: 4px; color: #454e5d; font-size: 9px; }
    .system-card { margin: 0 20px 20px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.025); }
    .system-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .system-name { color: #b7c0ca; font-size: 11px; }
    .system-value { color: var(--green); font-size: 10px; }

    .modal-backdrop { position: fixed; z-index: 20; display: none; place-items: center; inset: 0; padding: 22px; background: rgba(2,4,7,.72); backdrop-filter: blur(10px); }
    .modal-backdrop.open { display: grid; }
    .modal { width: min(520px, 100%); max-height: min(680px, 88vh); overflow: auto; border: 1px solid rgba(255,255,255,.11); border-radius: 20px; background: #10141c; box-shadow: 0 35px 100px #000; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 19px 21px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 15px; font-weight: 580; }
    .modal-body { padding: 20px 21px 23px; }
    .empty { padding: 30px 0; color: var(--muted); text-align: center; }
    .fact { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .fact strong { display: block; margin-bottom: 3px; color: #dce5ed; font-size: 12px; }
    .fact span { color: var(--muted); font-size: 11px; }
    .field { display: grid; gap: 7px; margin-bottom: 17px; }
    .field label { color: #8e98a5; font-size: 11px; }
    select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; color: #dce5ed; background: #151a24; }
    .danger-btn { width: 100%; padding: 10px; border: 1px solid rgba(255,120,136,.18); border-radius: 10px; color: #ff9daa; background: rgba(255,120,136,.055); cursor: pointer; }
    .danger-btn + .danger-btn { margin-top: 8px; }
    .danger-btn.resume { color: #8fd8c4; border-color: rgba(82,211,172,.2); background: rgba(82,211,172,.055); }
    .toast { position: fixed; z-index: 30; right: 25px; bottom: 24px; max-width: 360px; padding: 11px 15px; border: 1px solid var(--line-bright); border-radius: 11px; color: #dce9f0; background: #131923; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); pointer-events: none; transition: .25s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes breathe { 50% { transform: scale(1.08); opacity: .72; } }
    @keyframes drift { to { transform: translateY(7px) rotate(3deg); } }
    @keyframes listenPulse { 50% { transform: scale(1.045); box-shadow: inset -18px -22px 50px rgba(13,9,51,.58), 0 0 52px rgba(84,210,255,.33); } }
    @keyframes speakPulse { to { transform: scale(var(--voice-scale, 1.035)); filter: brightness(1.13); } }
    @keyframes avatarIdle { 50% { transform: translateY(-3px) rotate(.25deg); } }
    @keyframes avatarSpeak { to { transform: scale(var(--voice-scale, 1.025)) translateY(-2px); } }
    @keyframes scanDrift { to { background-position-y: 28px; } }
    @keyframes dots { 50% { opacity: .35; } }
    @keyframes enter { from { opacity: 0; transform: translateY(6px); } }

    @media (max-width: 1020px) {
      .app { grid-template-columns: 70px minmax(0, 1fr); }
      .activity { display: none; }
    }
    @media (max-width: 650px) {
      html, body { max-width: 100%; overflow-x: hidden; }
      body { overflow-y: auto; }
      .app { display: flex; width: 100%; max-width: 100vw; min-height: 100dvh; height: 100dvh; flex-direction: column; }
      .rail { order: 2; flex-direction: row; justify-content: center; width: 100%; height: 62px; padding: 8px 14px; border: 0; border-top: 1px solid var(--line); }
      .brand, .rail-bottom { display: none; }
      .rail-nav { flex: initial; flex-direction: row; }
      .icon-btn.active::before { left: 12px; top: -9px; width: 18px; height: 2px; }
      .workspace { flex: 1; width: 100%; max-width: 100vw; min-height: 0; padding: 0 16px 14px; }
      .topbar { height: 62px; }
      .connection { display: none; }
      .stage { width: 100%; max-width: 100%; justify-content: center; padding-top: 10px; }
      .orb-wrap { width: min(68vw, 285px); }
      .app.has-chat .orb-wrap { width: 155px; }
      .greeting { font-size: 23px; }
      .subline { font-size: 12px; }
      .suggestions { display: grid; width: 100%; max-width: 100%; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .suggestion { width: 100%; min-width: 0; padding-inline: 8px; overflow-wrap: anywhere; border-radius: 11px; white-space: normal; }
      .messages { max-height: 37vh; }
      .bubble { max-width: 87%; }
      .composer-wrap { width: 100%; min-width: 0; }
      .composer-foot span:last-child { display: none; }
      .toast { right: 15px; bottom: 76px; left: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" aria-label="Navegacao principal">
      <div class="brand" title="Gideon"><span class="brand-mark"></span></div>
      <nav class="rail-nav">
        <button class="icon-btn active" aria-label="Conversa" title="Conversa">
          <svg viewBox="0 0 24 24"><path d="M5 17.5 3.5 21l4.2-1.5c1.3.7 2.7 1 4.3 1 5 0 9-3.7 9-8.3S17 4 12 4s-9 3.7-9 8.2c0 2 .7 3.8 2 5.3Z"/></svg>
        </button>
        <button class="icon-btn" id="memoryBtn" aria-label="Memoria" title="Memoria">
          <svg viewBox="0 0 24 24"><path d="M9 4H6a2 2 0 0 0-2 2v3m11-5h3a2 2 0 0 1 2 2v3M9 20H6a2 2 0 0 1-2-2v-3m11 5h3a2 2 0 0 0 2-2v-3"/><circle cx="12" cy="12" r="4"/></svg>
        </button>
        <button class="icon-btn" id="activityBtn" aria-label="Atividade" title="Atividade">
          <svg viewBox="0 0 24 24"><path d="M4 12h3l2-6 4 12 2-6h5"/></svg>
        </button>
      </nav>
      <div class="rail-bottom">
        <button class="icon-btn" id="settingsBtn" aria-label="Configuracoes" title="Configuracoes">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
        </button>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="title-block"><h1>Gideon</h1><p>Inteligencia pessoal</p></div>
        <div class="connection offline" id="connection"><span class="connection-dot"></span><span id="connectionText">Conectando</span></div>
      </header>

      <section class="stage" aria-live="polite">
        <div class="orb-wrap" id="orbWrap" aria-label="Estado visual da Gideon">
          <div class="orbit"></div><div class="orb-halo"></div>
          <div class="avatar-shell" id="avatarShell">
            <img class="avatar-image" id="avatarImage" src="/avatar/gideon-idle.webp" alt="Retrato holografico da Gideon">
            <div class="avatar-scan"></div>
            <div class="orb avatar-fallback" aria-hidden="true"></div>
          </div>
        </div>
        <div class="state-label" id="stateLabel">Inicializando</div>
        <h2 class="greeting">Como posso ajudar, <strong>Henry?</strong></h2>
        <p class="subline">Estou pronta para conversar, lembrar e agir no seu computador.</p>
        <div class="suggestions">
          <button class="suggestion">Como esta meu computador?</button>
          <button class="suggestion">O que voce lembra sobre mim?</button>
          <button class="suggestion">Organize minhas prioridades de hoje</button>
          <button class="suggestion">Abra a pasta do projeto</button>
        </div>
        <div class="messages" id="messages" aria-label="Conversa"></div>
      </section>

      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <button class="compose-btn mic" type="button" id="micBtn" aria-label="Ativar voz" title="Ativar ou pausar voz">
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21m-3 0h6"/></svg>
          </button>
          <textarea id="messageInput" rows="1" placeholder="Fale ou escreva para Gideon..." aria-label="Mensagem"></textarea>
          <button class="compose-btn send" id="sendBtn" type="submit" aria-label="Enviar mensagem">
            <svg viewBox="0 0 24 24"><path d="m4 12 16-8-5.5 16-3-6.5L4 12Z"/><path d="m11.5 13.5 4-4"/></svg>
          </button>
        </form>
        <div class="composer-foot"><span id="voiceHint">Voz verificando...</span><span>Enter para enviar · Shift + Enter para nova linha</span></div>
      </div>
    </main>

    <aside class="activity" id="activityPanel">
      <div class="activity-head"><h2>Atividade</h2><span class="live-tag">Ao vivo</span></div>
      <div class="activity-list" id="activityList"><div class="activity-date">Nesta sessao</div></div>
      <div class="system-card">
        <div class="system-row"><span class="system-name">Gideon Core</span><span class="system-value" id="coreStatus">Iniciando</span></div>
      </div>
    </aside>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><h2 id="modalTitle">Memoria</h2><button class="icon-btn" id="modalClose" aria-label="Fechar">×</button></div>
      <div class="modal-body" id="modalBody"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const $ = (selector) => document.querySelector(selector);
    const app = $('#app');
    const messages = $('#messages');
    const input = $('#messageInput');
    const sendBtn = $('#sendBtn');
    const micBtn = $('#micBtn');
    const orbWrap = $('#orbWrap');
    const avatarShell = $('#avatarShell');
    const avatarImage = $('#avatarImage');
    const stateLabel = $('#stateLabel');
    const activityList = $('#activityList');
    const connection = $('#connection');
    const csrfHeaders = { 'X-Gideon-CSRF': '1' };
    let busy = false;
    let voiceActive = false;
    let socket;
    let reconnectTimer;
    let toastTimer;
    let lastSequence = 0;
    let currentState = 'idle';

    const stateNames = { idle: 'Pronta', listening: 'Ouvindo', thinking: 'Pensando', speaking: 'Falando', executing: 'Executando', observing: 'Observando', error: 'Atencao' };
    const avatarAssets = {
      idle: '/avatar/gideon-idle.webp',
      speaking: '/avatar/gideon-speaking.webp',
      thinking: '/avatar/gideon-thinking.webp',
      welcome: '/avatar/gideon-welcome.webp'
    };

    function showAvatar(name) {
      const asset = avatarAssets[name] || avatarAssets.idle;
      if (avatarImage.dataset.asset === asset) return;
      avatarShell.classList.remove('load-error');
      avatarImage.dataset.asset = asset;
      avatarImage.src = asset;
    }

    function setState(state) {
      const normalized = stateNames[state] ? state : 'idle';
      currentState = normalized;
      orbWrap.className = `orb-wrap ${normalized === 'idle' ? '' : normalized}`.trim();
      stateLabel.textContent = stateNames[normalized];
      if (normalized === 'speaking') showAvatar('speaking');
      else if (normalized === 'thinking' || normalized === 'executing') showAvatar('thinking');
      else showAvatar('idle');
    }

    function notify(text) {
      const toast = $('#toast');
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
    }

    function addActivity(title, detail, icon = 'G') {
      const event = document.createElement('div');
      event.className = 'event';
      const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const iconEl = document.createElement('div');
      iconEl.className = 'event-icon';
      iconEl.textContent = icon;
      const main = document.createElement('div');
      main.className = 'event-main';
      const titleEl = document.createElement('div');
      titleEl.className = 'event-title';
      titleEl.textContent = title;
      const detailEl = document.createElement('div');
      detailEl.className = 'event-detail';
      detailEl.textContent = detail;
      const timeEl = document.createElement('div');
      timeEl.className = 'event-time';
      timeEl.textContent = time;
      main.append(titleEl, detailEl, timeEl);
      event.append(iconEl, main);
      activityList.insertBefore(event, activityList.children[1] || null);
      while (activityList.querySelectorAll('.event').length > 12) activityList.lastElementChild.remove();
    }

    function addMessage(role, text = '') {
      app.classList.add('has-chat');
      const row = document.createElement('div');
      row.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      if (role === 'assistant') {
        const assistantMark = document.createElement('div');
        assistantMark.className = 'assistant-mark';
        assistantMark.textContent = 'G';
        row.append(assistantMark, bubble);
      } else {
        row.append(bubble);
      }
      messages.append(row);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    async function authenticate() {
      const params = new URLSearchParams(location.hash.slice(1));
      const token = params.get('token');
      if (token) {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...csrfHeaders },
          body: JSON.stringify({ token })
        });
        history.replaceState(null, '', location.pathname + location.search);
        if (!response.ok) {
          const existingSession = await fetch('/api/status');
          if (!existingSession.ok) throw new Error('Nao foi possivel autenticar esta janela.');
        }
      }
      const response = await fetch('/api/status');
      if (!response.ok) throw new Error('Abra a Gideon pelo atalho do aplicativo.');
      return response.json();
    }

    function connectSocket() {
      clearTimeout(reconnectTimer);
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/ws`);
      socket.onopen = () => {
        connection.classList.remove('offline');
        $('#connectionText').textContent = 'Online';
        socket.send(JSON.stringify({ tipo: 'pronto', cliente: 'app' }));
      };
      socket.onmessage = ({ data }) => {
        let event;
        try { event = JSON.parse(data); } catch { return; }
        if (event.sequencia && event.sequencia <= lastSequence) return;
        if (event.sequencia) lastSequence = event.sequencia;
        if (event.tipo === 'estado_ia') setState(event.estado);
        if (event.tipo === 'ouvindo') setState(event.ativo ? 'listening' : 'idle');
        if (event.tipo === 'pensando') setState(event.ativo ? 'thinking' : 'idle');
        if (event.tipo === 'fala_inicio') setState('speaking');
        if (event.tipo === 'fala_fim') setState('idle');
        if (event.tipo === 'transcricao_voz' && event.texto) {
          addMessage('user', event.texto);
          addActivity('Comando de voz', event.texto, 'V');
        }
        if (event.tipo === 'resposta_voz' && event.texto) addMessage('assistant', event.texto);
        if (event.tipo === 'parada_emergencia') {
          setState(event.ativa ? 'error' : 'idle');
          addActivity(event.ativa ? 'Parada de emergencia' : 'Execucao retomada', event.ativa ? 'Ferramentas locais bloqueadas' : 'Ferramentas locais liberadas', event.ativa ? '!' : '✓');
        }
        if (event.tipo === 'voz_nivel') {
          const level = Math.max(0, Math.min(1, Number(event.nivel) || 0));
          orbWrap.style.setProperty('--voice-scale', String(1 + level * .055));
        }
        if (event.tipo === 'status') {
          if (event.estado_interface) {
            lastSequence = event.estado_interface.sequencia || lastSequence;
            setState(event.estado_interface.estado || 'idle');
          }
          addActivity('Nucleo sincronizado', event.modelo || 'Modelo conectado', 'AI');
        }
      };
      socket.onclose = () => {
        connection.classList.add('offline');
        $('#connectionText').textContent = 'Reconectando';
        reconnectTimer = setTimeout(connectSocket, 1800);
      };
    }

    async function sendMessage(text) {
      const clean = text.trim();
      if (!clean || busy) return;
      busy = true;
      sendBtn.disabled = true;
      input.value = '';
      resizeInput();
      addMessage('user', clean);
      const answer = addMessage('assistant');
      answer.classList.add('thinking');
      if (!['Ouvindo', 'Falando'].includes(stateLabel.textContent)) setState('thinking');
      addActivity('Solicitacao recebida', clean, '→');

      try {
        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...csrfHeaders },
          body: JSON.stringify({ mensagem: clean })
        });
        if (!response.ok || !response.body) throw new Error(`Falha na resposta (${response.status})`);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let resultText = '';
        let metadata = null;
        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          const blocks = buffer.split('\n\n');
          buffer = blocks.pop() || '';
          for (const block of blocks) {
            const payload = block.split('\n').filter(line => line.startsWith('data:')).map(line => line.slice(5).trim()).join('');
            if (!payload) continue;
            const event = JSON.parse(payload);
            if (event.tipo === 'chunk') {
              resultText += event.texto || '';
              answer.classList.remove('thinking');
              answer.textContent = resultText.replace(/\[EMOCAO:[^\]]+\]/gi, '').trimStart();
              messages.scrollTop = messages.scrollHeight;
            } else if (event.tipo === 'fim') {
              metadata = event;
            } else if (event.tipo === 'erro') {
              throw new Error(event.mensagem || 'Erro no processamento');
            }
          }
          if (done) break;
        }
        answer.classList.remove('thinking');
        if (!answer.textContent) answer.textContent = 'Concluido.';
        if (metadata) {
          const meta = document.createElement('div');
          meta.className = 'message-meta';
          const model = metadata.modelo ? metadata.modelo.replace('models/', '') : 'Gideon';
          meta.textContent = `${model} · ${metadata.total_tokens || 0} tokens`;
          answer.append(meta);
        }
        addActivity('Resposta concluida', `${answer.textContent.slice(0, 64)}${answer.textContent.length > 64 ? '...' : ''}`, '✓');
      } catch (error) {
        answer.classList.remove('thinking');
        answer.textContent = `Nao consegui concluir: ${error.message}`;
        addActivity('Falha na solicitacao', error.message, '!');
        setState('error');
      } finally {
        busy = false;
        sendBtn.disabled = false;
        if (stateLabel.textContent === stateNames.thinking) setState('idle');
        input.focus();
      }
    }

    async function loadVoiceStatus() {
      try {
        const response = await fetch('/api/voz/status');
        if (!response.ok) throw new Error();
        const data = await response.json();
        if (data.inicializacao === 'inicializando') {
          $('#voiceHint').textContent = 'Inicializando voz...';
          setTimeout(loadVoiceStatus, 1200);
          return;
        }
        voiceActive = Boolean(data.ativa ?? data.ativo ?? data.escuta_ativa ?? data.rodando);
        updateVoiceUi();
      } catch { $('#voiceHint').textContent = 'Voz indisponivel'; }
    }

    async function loadRecentActivity() {
      try {
        const response = await fetch('/api/execucoes/historico?limite=5');
        if (!response.ok) return;
        const data = await response.json();
        for (const item of (data.execucoes || []).reverse()) {
          addActivity(
            item.ferramenta || 'Ferramenta local',
            item.mensagem_humana || item.estado || 'Execucao registrada',
            item.verificado === false ? '!' : '✓'
          );
        }
      } catch { /* A atividade ao vivo continua funcionando sem historico. */ }
    }

    function updateVoiceUi() {
      micBtn.classList.toggle('active', voiceActive);
      micBtn.setAttribute('aria-label', voiceActive ? 'Pausar voz' : 'Ativar voz');
      $('#voiceHint').textContent = voiceActive ? 'Voz ativa · diga “Gideon”' : 'Voz pausada';
    }

    async function toggleVoice() {
      micBtn.disabled = true;
      try {
        const endpoint = voiceActive ? '/api/voz/parar' : '/api/voz/iniciar';
        const response = await fetch(endpoint, { method: 'POST', headers: csrfHeaders });
        if (!response.ok) throw new Error('Controle de voz indisponivel');
        const result = await response.json();
        if (result.status === 'inicializando') {
          $('#voiceHint').textContent = 'Inicializando voz...';
          setTimeout(loadVoiceStatus, 1200);
          return;
        }
        voiceActive = !voiceActive;
        updateVoiceUi();
        addActivity(voiceActive ? 'Escuta ativada' : 'Escuta pausada', voiceActive ? 'Aguardando a palavra Gideon' : 'Microfone em pausa', 'V');
      } catch (error) { notify(error.message); }
      finally { micBtn.disabled = false; }
    }

    function resizeInput() {
      input.style.height = 'auto';
      input.style.height = `${Math.min(input.scrollHeight, 112)}px`;
    }

    function openModal(title, content) {
      $('#modalTitle').textContent = title;
      const body = $('#modalBody');
      body.replaceChildren();
      if (typeof content === 'string') body.innerHTML = content;
      else body.append(content);
      $('#modalBackdrop').classList.add('open');
    }

    async function showMemory() {
      openModal('Memoria', '<div class="empty">Consultando lembrancas...</div>');
      try {
        const response = await fetch('/api/memoria/fatos');
        if (!response.ok) throw new Error();
        const { fatos } = await response.json();
        const container = document.createElement('div');
        if (!fatos.length) container.innerHTML = '<div class="empty">Nenhum fato permanente registrado.</div>';
        fatos.forEach(fact => {
          const item = document.createElement('div');
          item.className = 'fact';
          const key = document.createElement('strong');
          key.textContent = fact.chave;
          const value = document.createElement('span');
          value.textContent = fact.valor;
          item.append(key, value);
          container.append(item);
        });
        $('#modalBody').replaceChildren(container);
      } catch { $('#modalBody').innerHTML = '<div class="empty">Nao foi possivel carregar a memoria.</div>'; }
    }

    function showSettings() {
      const content = document.createElement('div');
      content.innerHTML = `
        <div class="field">
          <label for="languageSelect">Idioma da Gideon</label>
          <select id="languageSelect">
            <option value="pt-BR">Português (Brasil)</option>
            <option value="en-US">English (US)</option>
            <option value="es-ES">Español</option>
          </select>
        </div>
        <div class="field"><label for="voiceMode">Modo de escuta</label><select id="voiceMode"><option value="ativacao_por_nome">Ativacao por nome</option><option value="conversa_continua">Conversa continua</option><option value="conversa_livre">Conversa livre</option></select></div>
        <button class="danger-btn" id="emergencyStop">Parada de emergencia</button>
        <button class="danger-btn resume" id="emergencyResume">Retomar ferramentas</button>
        <button class="danger-btn" id="clearChat">Limpar conversa atual</button>`;
      openModal('Configuracoes', content);
      fetch('/api/idioma').then(r => r.json()).then(data => { if (data.idioma) $('#languageSelect').value = data.idioma; }).catch(() => {});
      fetch('/api/voz/status').then(r => r.json()).then(data => { if (data.modo_escuta) $('#voiceMode').value = data.modo_escuta; }).catch(() => {});
      content.querySelector('#languageSelect').onchange = async (event) => {
        const response = await fetch('/api/idioma', { method: 'POST', headers: { 'Content-Type': 'application/json', ...csrfHeaders }, body: JSON.stringify({ idioma: event.target.value }) });
        notify(response.ok ? 'Idioma atualizado com sucesso.' : 'Nao foi possivel alterar o idioma.');
      };
      content.querySelector('#voiceMode').onchange = async (event) => {
        const response = await fetch('/api/voz/configurar', { method: 'POST', headers: { 'Content-Type': 'application/json', ...csrfHeaders }, body: JSON.stringify({ modo_escuta: event.target.value }) });
        notify(response.ok ? 'Modo de voz atualizado.' : 'Nao foi possivel alterar o modo.');
      };
      content.querySelector('#clearChat').onclick = async () => {
        const response = await fetch('/api/chat/limpar', { method: 'POST', headers: csrfHeaders });
        if (response.ok) { messages.replaceChildren(); app.classList.remove('has-chat'); closeModal(); addActivity('Conversa limpa', 'O contexto da sessao foi reiniciado', '×'); }
      };
      content.querySelector('#emergencyStop').onclick = async () => {
        const response = await fetch('/api/emergencia/parar', { method: 'POST', headers: csrfHeaders });
        notify(response.ok ? 'Ferramentas bloqueadas pela parada de emergencia.' : 'Nao foi possivel ativar a parada.');
      };
      content.querySelector('#emergencyResume').onclick = async () => {
        const response = await fetch('/api/emergencia/retomar', { method: 'POST', headers: csrfHeaders });
        notify(response.ok ? 'Ferramentas liberadas novamente.' : 'Nao foi possivel retomar as ferramentas.');
      };
    }

    function showActivity() {
      const content = activityList.cloneNode(true);
      content.className = 'activity-list';
      content.style.maxHeight = '60vh';
      openModal('Atividade desta sessao', content);
    }

    function closeModal() { $('#modalBackdrop').classList.remove('open'); }

    $('#chatForm').addEventListener('submit', event => { event.preventDefault(); sendMessage(input.value); });
    input.addEventListener('input', resizeInput);
    input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(input.value); } });
    micBtn.addEventListener('click', toggleVoice);
    document.querySelectorAll('.suggestion').forEach(button => button.addEventListener('click', () => sendMessage(button.textContent)));
    $('#memoryBtn').addEventListener('click', showMemory);
    $('#settingsBtn').addEventListener('click', showSettings);
    $('#activityBtn').addEventListener('click', showActivity);
    $('#modalClose').addEventListener('click', closeModal);
    $('#modalBackdrop').addEventListener('click', event => { if (event.target === event.currentTarget) closeModal(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    avatarImage.addEventListener('error', () => avatarShell.classList.add('load-error'));

    (async function start() {
      try {
        const status = await authenticate();
        connection.classList.remove('offline');
        $('#connectionText').textContent = 'Online';
        $('#coreStatus').textContent = 'Operacional';
        setState('idle');
        showAvatar('welcome');
        setTimeout(() => { if (currentState === 'idle') showAvatar('idle'); }, 3200);
        addActivity('Gideon iniciada', `${status.modelo || 'Nucleo'} · v${status.versao || '0.4.0'}`, 'G');
        connectSocket();
        loadVoiceStatus();
        loadRecentActivity();
        input.focus();
      } catch (error) {
        setState('error');
        $('#connectionText').textContent = 'Sem acesso';
        $('#coreStatus').textContent = 'Bloqueado';
        input.disabled = true;
        sendBtn.disabled = true;
        notify(error.message);
      }
    })();
